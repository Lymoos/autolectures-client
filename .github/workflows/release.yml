name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$v" -o autolectures.exe .
          Compress-Archive -Path autolectures.exe -DestinationPath autolectures-windows-x64.zip
          (Get-FileHash autolectures-windows-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline autolectures-windows-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            autolectures-windows-x64.zip
            autolectures-windows-x64.zip.sha256
